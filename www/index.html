<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Chocolates Mama</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/production.css">
    <link rel="stylesheet" href="css/orders.css">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- For Web SQLite Support -->
    <jeep-sqlite></jeep-sqlite>

    <header class="app-header">
        <h1 id="page-title">Productos</h1>
        <div class="header-actions" id="header-actions">
            <!-- Dynamic context actions like "Add" -->
        </div>
    </header>

    <main id="app-container" class="app-container">
        <!-- Content injected here via router.js -->
        <div class="loader">
            <div class="spinner"></div>
        </div>
    </main>

    <nav class="bottom-nav">
        <a href="#productos" class="nav-item active" id="nav-productos">
            <span class="nav-icon">🍫</span>
            <span class="nav-label">Productos</span>
        </a>
        <a href="#pedidos" class="nav-item" id="nav-pedidos">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Pedidos</span>
        </a>
        <a href="#produccion" class="nav-item" id="nav-produccion">
            <span class="nav-icon">⚙️</span>
            <span class="nav-label">Producción</span>
        </a>
    </nav>

    <script type="module" src="js/app.js"></script>
</body>
</html>
