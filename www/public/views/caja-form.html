<div class="form-view animate-in">
    <div class="form-group">
        <label>Nombre de la Caja *</label>
        <input type="text" id="c-nombre" placeholder="Ej: Especial San Valentín" required>
    </div>

    <div class="form-row">
        <div class="form-group">
            <label>Empaque / Forma *</label>
            <input type="text" id="c-empaque" placeholder="Caja cartón, Madera, Corazón...">
        </div>
    </div>

    <div class="card selector-card">
        <label>Contenido de la Caja (Selecciona los chocolates)</label>
        <div id="box-items-selector" class="items-selector-list">
            <p style="color: var(--text-muted); font-size: 13px;">Cargando productos...</p>
        </div>
    </div>

    <div class="form-row">
        <div class="form-group" style="display: none;">
            <label>Precio Empaque</label>
            <input type="number" id="c-precio-empaque" step="0.01" value="0">
        </div>
        <div class="form-group">
            <label>Precio Final Caja *</label>
            <input type="number" id="c-precio-total" step="0.01" placeholder="0.00">
        </div>
    </div>

    <div class="form-actions">
        <button class="btn btn-secondary" onclick="window.location.hash = 'productos'">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-box">Crear Caja</button>
    </div>

    <div id="danger-zone" class="danger-zone" style="display: none; margin-top: 40px; padding-top: 20px; border-top: 1px solid #fee;">
        <p style="color: #d32f2f; font-size: 12px; margin-bottom: 10px; font-weight: 600;">ZONA DE PELIGRO</p>
        <button class="btn btn-danger-outline" id="btn-delete-item" style="width: 100%; border: 1px solid #d32f2f; color: #d32f2f; background: transparent; padding: 10px; border-radius: 8px;">
            Eliminar esta Caja
        </button>
    </div>
</div>

<style>
    .selector-card {
        background: #fdfaf5;
        border: 1px dashed var(--secondary);
        margin: 20px 0;
    }
    .items-selector-list {
        max-height: 250px;
        overflow-y: auto;
        margin-top: 10px;
    }
    .selector-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        border-bottom: 1px solid #f0efe9;
    }
    .selector-item label { 
        margin-bottom: 0; 
        font-weight: 500; 
        flex: 1; 
        font-size: 15px;
    }
    .qty-input {
        width: 70px;
        height: 44px;
        padding: 8px;
        text-align: center;
        border: 2px solid #f0efe9;
        border-radius: 10px;
        font-weight: 700;
        font-size: 16px;
    }
</style>
