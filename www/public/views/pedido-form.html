<div class="form-view animate-in">
    <header class="form-header-inline">
        <h3>Nuevo Pedido</h3>
    </header>
    
    <div class="card form-section shadow-sm">
        <label class="section-subtitle">DATOS DEL CLIENTE</label>
        <div class="form-group">
            <input type="text" id="ped-destinatario" placeholder="Nombre completo *" required>
        </div>

        <div class="form-row">
            <div class="form-group">
                <input type="tel" id="ped-telefono" placeholder="Teléfono (opcional)">
            </div>
            <div class="form-group">
                <select id="ped-plataforma" class="modern-input" style="padding: 10px; height: 44px; margin-bottom: 0;">
                    <option value="">Plataforma (opcional)</option>
                    <option value="WhatsApp">WhatsApp</option>
                    <option value="Facebook">Facebook</option>
                    <option value="Instagram">Instagram</option>
                </select>
            </div>
        </div>

        <div class="form-group">
            <label>Fecha de Entrega *</label>
            <input type="date" id="ped-fecha">
        </div>

        <div class="form-group">
            <label class="switch-container">
                <input type="checkbox" id="ped-envio">
                <span class="switch"></span>
                ¿Requiere envío?
            </label>
        </div>

        <div id="dir-container" class="form-group hidden-force">
            <input type="text" id="ped-direccion" placeholder="Dirección de Envío *">
            
            <div style="margin-top: 10px;">
                <label style="font-size: 11px; font-weight: 700;">COSTO DE ENVÍO</label>
                <select id="ped-costo-envio" class="modern-input" style="margin-bottom: 0;">
                    <option value="20">$20</option>
                    <option value="30">$30</option>
                    <option value="40">$40</option>
                </select>
            </div>
        </div>
    </div>

    <div class="items-section">
        <div class="section-title">
            <label class="section-subtitle">LO QUE LLEVA EL PEDIDO</label>
            <button class="btn btn-secondary" id="btn-add-item" style="padding: 12px 20px; font-size: 14px;">+ Añadir Producto</button>
        </div>

        <div id="pedido-items-list" class="pedido-items-list">
            <div class="empty-items-text">Aún no has agregado nada</div>
        </div>

        <div class="total-card">
            <span class="total-label">PRECIO TOTAL</span>
            <span id="ped-total" class="total-amount">$ 0.00</span>
        </div>
    </div>

    <div class="form-actions-fixed">
        <button class="btn btn-outline" onclick="window.location.hash = 'pedidos'">Cancelar</button>
        <button class="btn btn-primary" id="btn-save-pedido">Confirmar Pedido</button>
    </div>
</div>

<!-- Modal Centrado -->
<div id="modal-item" class="modal-overlay hidden-force">
    <div class="modal-center-panel animate-in">
        <div class="modal-header">
            <h4>Elegir Producto / Caja</h4>
            <button class="close-modal" id="btn-close-modal">✕</button>
        </div>
        <div class="modal-body">
            <input type="text" id="search-item" class="modern-input" placeholder="Buscar por nombre...">
            <div id="modal-list" class="modal-list-scroll">
                <!-- Se llena dinámicamente -->
            </div>
        </div>
    </div>
</div>
